<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Travel Vibe App</title>

    <!-- iOS Web App 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TravelVibe">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.330.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
    }
    </script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <style>
        /* CSS Reset: 強制禁止水平捲動 */
        html, body { 
            overflow-x: hidden; 
            width: 100%; 
            position: relative;
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
        }
        
        #root {
            overflow-x: hidden;
            width: 100%;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(214, 211, 209, 0.5); border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(214, 211, 209, 0.8); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Plane, MapPin, GripVertical, Trash2, Plus, Calendar, 
            Link as LinkIcon, Edit3, CheckCircle2, Clock, ExternalLink, 
            PlaneTakeoff, PlaneLanding, Menu, X, ChevronDown, 
            Utensils, ShoppingBag, Camera, TrainFront, MoreHorizontal, 
            Map, Cloud, LogOut, AlertTriangle, Search, RefreshCw, Smartphone, Users,
            StickyNote, Check
        } from 'lucide-react';

        // --- Firebase Imports ---
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "firebase/auth";
        import { 
            getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query 
        } from "firebase/firestore";

        // --- Firebase Configuration ---
        let firebaseConfig;
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            } else {
                throw new Error('Environment config missing');
            }
        } catch (e) {
            console.warn("Using fallback Firebase config.");
            firebaseConfig = {
                apiKey: "AIzaSyAJ_b9BiX1zT7WFu8f08uoKxeV8vgDUHz4",
                authDomain: "fuktrip.firebaseapp.com",
                projectId: "fuktrip",
                storageBucket: "fuktrip.firebasestorage.app",
                messagingSenderId: "663462561018",
                appId: "1:663462561018:web:d0c9f00c9fed0253a2b543",
                measurementId: "G-KME94X3EKH"
            };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'travel-vibe-shared-v1';
        const SHARED_SYNC_CODE = 'GLOBAL_PUBLIC_TRIP_V1';

        // --- Helper Components ---
        const BlurInput = ({ value, onSave, className, placeholder, ...props }) => {
            const [localValue, setLocalValue] = useState(value || '');
            useEffect(() => setLocalValue(value || ''), [value]);
            const handleBlur = () => { if (localValue !== value) onSave(localValue); };
            const handleKeyDown = (e) => { if (e.key === 'Enter') { e.target.blur(); if (props.onKeyDown) props.onKeyDown(e); } };
            return <input {...props} className={className} placeholder={placeholder} value={localValue} onChange={(e) => setLocalValue(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} />;
        };

        const BlurTextarea = ({ value, onSave, className, placeholder, ...props }) => {
            const [localValue, setLocalValue] = useState(value || '');
            useEffect(() => setLocalValue(value || ''), [value]);
            const handleBlur = () => { if (localValue !== value) onSave(localValue); };
            const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.blur(); } if (props.onKeyDown) props.onKeyDown(e); };
            return <textarea {...props} className={className} placeholder={placeholder} value={localValue} onChange={(e) => setLocalValue(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} />;
        };

        // --- Constants ---
        const CATEGORIES = {
            sightseeing: { label: '景點', icon: Camera, color: 'text-amber-600 bg-amber-100' },
            food: { label: '用餐', icon: Utensils, color: 'text-orange-600 bg-orange-100' },
            shopping: { label: '購物', icon: ShoppingBag, color: 'text-rose-600 bg-rose-100' },
            transport: { label: '交通', icon: TrainFront, color: 'text-stone-600 bg-stone-200' },
            other: { label: '其他', icon: MoreHorizontal, color: 'text-stone-400 bg-stone-100' },
        };

        const MOCK_FLIGHT_DB = {
            'JX800': { dep: '08:30', arr: '12:45', from: 'TPE (台北)', to: 'NRT (東京)', airline: '星宇航空' },
            'JX801': { dep: '13:55', arr: '16:25', from: 'NRT (東京)', to: 'TPE (台北)', airline: '星宇航空' },
            'BR198': { dep: '08:50', arr: '13:15', from: 'TPE (台北)', to: 'NRT (東京)', airline: '長榮航空' },
            'BR178': { dep: '06:30', arr: '10:10', from: 'TPE (台北)', to: 'KIX (大阪)', airline: '長榮航空' },
            'CI100': { dep: '08:55', arr: '13:15', from: 'TPE (台北)', to: 'NRT (東京)', airline: '中華航空' },
            'CI831': { dep: '09:20', arr: '11:50', from: 'TPE (台北)', to: 'BKK (曼谷)', airline: '中華航空' },
            'IT200': { dep: '06:40', arr: '10:25', from: 'TPE (台北)', to: 'NRT (東京)', airline: '台灣虎航' },
        };

        const generateRandomFlight = (code) => {
            const hours = Math.floor(Math.random() * 12) + 6;
            const mins = Math.floor(Math.random() * 12) * 5;
            const duration = 3 + Math.floor(Math.random() * 2);
            return {
                dep: `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`,
                arr: `${(hours + duration) % 24}:${mins.toString().padStart(2, '0')}`,
                from: 'TPE (未知出發地)', to: 'DEST (目的地)', airline: `航班 ${code.toUpperCase()}`
            };
        };

        const LinkifiedText = ({ text }) => {
            if (!text) return null;
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return (
                <span className="whitespace-pre-wrap break-words leading-relaxed block w-full">
                    {text.split(urlRegex).map((part, i) => part.match(urlRegex) ? 
                        <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="text-amber-600 hover:text-amber-700 hover:underline inline-flex items-center gap-0.5 font-medium transition-colors" onClick={(e) => e.stopPropagation()}><ExternalLink size={12} />{part.length > 30 ? part.substring(0, 30) + '...' : part}</a> 
                        : part
                    )}
                </span>
            );
        };

        const DEFAULT_TRIP = {
            id: 'default-1',
            destination: '東京 Tokyo',
            days: 3, 
            flights: { outbound: { date: '', code: '', data: null }, inbound: { date: '', code: '', data: null } },
            memos: [{ id: 1, content: "記得帶護照！" }, { id: 2, content: "訂房網址: https://www.agoda.com" }],
            itinerary: [
                { id: 1, day: 1, time: '06:30', title: '前往桃園機場', location: 'TPE Terminal 2', category: 'transport', note: '記得先線上報到' },
                { id: 2, day: 1, time: '13:00', title: '抵達飯店 Check-in', location: 'Shinjuku Prince Hotel', category: 'other' },
                { id: 3, day: 1, time: '18:00', title: '晚餐：一蘭拉麵', location: 'Shinjuku Kabukicho', category: 'food', note: '官網菜單：https://ichiran.com' },
            ]
        };

        function TravelVibeApp() {
            const [user, setUser] = useState(null);
            const [trips, setTrips] = useState([]); 
            const [currentTripId, setCurrentTripId] = useState(null);
            const [showTripMenu, setShowTripMenu] = useState(false);
            
            // App States
            const [flightTab, setFlightTab] = useState('outbound');
            const [isFlightExpanded, setIsFlightExpanded] = useState(false);
            const [isSearchingFlight, setIsSearchingFlight] = useState(false);
            const [editingMemoId, setEditingMemoId] = useState(null);
            const [selectedDay, setSelectedDay] = useState(1);
            const [editingCategory, setEditingCategory] = useState(null);
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [newTripName, setNewTripName] = useState("");
            const [tripToDelete, setTripToDelete] = useState(null);
            
            // Note Editing States
            const [editingNoteId, setEditingNoteId] = useState(null);
            const [tempNote, setTempNote] = useState(""); 
            const [tempMemoContent, setTempMemoContent] = useState(""); // 新增：暫存備忘錄內容

            const dragItem = useRef(null);
            const dragOverItem = useRef(null);
            const hoverHandleId = useRef(null);

            // 1. Auth
            useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        try {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } catch (e) {
                            console.error("Auth Error", e);
                            await signInAnonymously(auth);
                        }
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // 2. Data Sync
            useEffect(() => {
                if (!user) return;
                
                const tripsCollectionRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'trips');
                const q = query(tripsCollectionRef);

                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const allTrips = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const myTrips = allTrips.filter(t => t.syncCode === SHARED_SYNC_CODE);
                    
                    myTrips.sort((a, b) => {
                        const timeA = a.lastModified || parseInt(a.id) || 0;
                        const timeB = b.lastModified || parseInt(b.id) || 0;
                        return timeB - timeA;
                    });

                    if (myTrips.length === 0) {
                        saveTripToFirebase({ ...DEFAULT_TRIP, id: Date.now().toString(), syncCode: SHARED_SYNC_CODE, lastModified: Date.now() });
                    } else {
                        setTrips(myTrips);
                        if (!currentTripId || !myTrips.find(t => t.id === currentTripId)) {
                            setCurrentTripId(myTrips[0].id);
                        }
                    }
                }, (error) => console.error("Firestore Error:", error));
                
                return () => unsubscribe();
            }, [user, currentTripId]); 

            const saveTripToFirebase = async (tripData) => {
                if (!user) return;
                try {
                    const dataToSave = { ...tripData, syncCode: SHARED_SYNC_CODE, lastModified: Date.now() };
                    const tripRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', tripData.id);
                    await setDoc(tripRef, dataToSave, { merge: true });
                } catch (e) { console.error("Save Error:", e); }
            };

            const deleteTripFromFirebase = async (tripId) => {
                if (!user) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', tripId));
                } catch (e) { console.error("Delete Error:", e); }
            };

            const currentTrip = trips.find(t => t.id === currentTripId) || DEFAULT_TRIP;
            const currentFlight = currentTrip.flights?.[flightTab] || { date: '', code: '', data: null };
            const displayFlightData = currentFlight.data || { dep: '', arr: '', from: '', to: '', airline: '' };
            const dayItinerary = (currentTrip.itinerary || []).filter(item => (item.day || 1) === selectedDay);

            // Logic Helpers
            const updateTripData = (field, value) => saveTripToFirebase({ ...currentTrip, [field]: value });
            const updateFlightInput = (type, field, value) => { const flights = { ...currentTrip.flights }; flights[type] = { ...flights[type], [field]: value }; updateTripData('flights', flights); };
            const updateFlightData = (type, field, value) => {
                const flights = { ...currentTrip.flights };
                if (!flights[type]) flights[type] = { date: '', code: '', data: {} };
                const currentData = flights[type].data || { dep: '', arr: '', from: '', to: '', airline: '' };
                flights[type].data = { ...currentData, [field]: value };
                updateTripData('flights', flights);
            };
            const searchFlight = (type) => {
                const code = currentTrip.flights[type].code; if (!code) return; setIsSearchingFlight(true);
                setTimeout(() => {
                    const formattedCode = code.toUpperCase().replace(/\s/g, '');
                    const data = MOCK_FLIGHT_DB[formattedCode] || generateRandomFlight(formattedCode);
                    const flights = { ...currentTrip.flights }; flights[type] = { ...flights[type], data: data };
                    updateTripData('flights', flights); setIsSearchingFlight(false);
                }, 600);
            };
            
            // Memo Helpers (Updated)
            const addMemo = () => { 
                const newId = Date.now();
                const newMemos = [...currentTrip.memos, { id: newId, content: "" }]; 
                updateTripData('memos', newMemos); 
                // 直接進入編輯模式
                setEditingMemoId(newId); 
                setTempMemoContent(""); 
            };
            const updateMemo = (id, content) => { const newMemos = currentTrip.memos.map(m => m.id === id ? { ...m, content } : m); updateTripData('memos', newMemos); };
            const deleteMemo = (id) => updateTripData('memos', currentTrip.memos.filter(m => m.id !== id));
            
            // Memo Edit Handlers
            const handleStartEditMemo = (memo) => {
                setEditingMemoId(memo.id);
                setTempMemoContent(memo.content || "");
            };
            const handleSaveMemo = (id) => {
                updateMemo(id, tempMemoContent);
                setEditingMemoId(null);
            };
            const handleCancelMemo = (id) => {
                const memo = currentTrip.memos.find(m => m.id === id);
                // 如果是空的（例如剛新增但沒輸入內容），取消時直接刪除
                if (!memo.content || !memo.content.trim()) {
                    deleteMemo(id);
                }
                setEditingMemoId(null);
            };

            const addItineraryItem = () => { const newItem = { id: Date.now(), day: selectedDay, time: '12:00', title: '新行程', location: '地點', category: 'other', note: '' }; updateTripData('itinerary', [...currentTrip.itinerary, newItem]); };
            const updateItineraryItem = (id, field, value) => { const newItinerary = currentTrip.itinerary.map(item => item.id === id ? { ...item, [field]: value } : item); updateTripData('itinerary', newItinerary); };
            const deleteItineraryItem = (id) => updateTripData('itinerary', currentTrip.itinerary.filter(item => item.id !== id));
            const addDay = () => { const newDays = (currentTrip.days || 1) + 1; updateTripData('days', newDays); setSelectedDay(newDays); };
            const openGoogleMaps = (location) => { if (!location || location === '地點') return; window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`, '_blank'); };
            const confirmCreateTrip = () => {
                if (!newTripName.trim()) return;
                const newTripId = Date.now().toString();
                const newTrip = { ...DEFAULT_TRIP, id: newTripId, destination: newTripName, flights: { outbound: { date: '', code: '', data: null }, inbound: { date: '', code: '', data: null } }, memos: [], itinerary: [], days: 3, lastModified: Date.now(), syncCode: SHARED_SYNC_CODE };
                saveTripToFirebase(newTrip); setCurrentTripId(newTripId); setShowCreateModal(false);
            };
            const confirmDeleteTrip = () => { if (tripToDelete) { deleteTripFromFirebase(tripToDelete); setTripToDelete(null); } };
            const handleSort = () => {
                const currentDayItems = currentTrip.itinerary.filter(i => (i.day || 1) === selectedDay);
                const otherItems = currentTrip.itinerary.filter(i => (i.day || 1) !== selectedDay);
                const draggedItemContent = currentDayItems.splice(dragItem.current, 1)[0];
                currentDayItems.splice(dragOverItem.current, 0, draggedItemContent);
                dragItem.current = null; dragOverItem.current = null;
                updateTripData('itinerary', [...otherItems, ...currentDayItems]);
            };

            const handleStartEditNote = (item) => { setEditingNoteId(item.id); setTempNote(item.note || ""); };
            const handleSaveNote = (itemId) => { updateItineraryItem(itemId, 'note', tempNote); setEditingNoteId(null); };
            const handleCancelNote = () => { setEditingNoteId(null); setTempNote(""); };

            if (!user) return <div className="min-h-screen bg-amber-50 flex items-center justify-center"><div className="text-amber-500 animate-pulse flex flex-col items-center gap-2"><Cloud size={48} /><span className="font-bold">Loading Cloud Data...</span></div></div>;

            return (
                <div className="min-h-screen bg-stone-50 text-stone-800 font-sans selection:bg-amber-200 pb-20 relative overflow-x-hidden w-full">
                    <div className="fixed top-0 left-0 w-full h-80 bg-gradient-to-br from-amber-300 via-orange-300 to-rose-200 rounded-b-[4rem] shadow-xl shadow-amber-100/50 z-0 transition-all duration-700" />
                    <div className="relative z-10 w-full max-w-5xl mx-auto px-4 pt-8">
                        {/* Header */}
                        <div className="flex justify-between items-start mb-10 text-stone-800">
                            <div className="relative max-w-[70%]">
                                <button onClick={() => setShowTripMenu(!showTripMenu)} className="group flex items-center gap-3 bg-white/60 backdrop-blur-md px-5 py-3 rounded-2xl hover:bg-white/80 transition-all border border-white/40 shadow-sm w-full">
                                    <div className="bg-amber-100 p-2 rounded-xl group-hover:scale-110 transition-transform text-amber-600 shrink-0"><MapPin size={24} /></div>
                                    <div className="text-left overflow-hidden">
                                        <div className="text-xs text-stone-500 font-bold uppercase tracking-wider">Current Trip</div>
                                        <div className="text-xl font-bold flex items-center gap-2 text-stone-800 truncate">
                                            <span className="truncate block">{currentTrip.destination}</span>
                                            <ChevronDown size={16} className={`transition-transform text-stone-400 shrink-0 ${showTripMenu ? 'rotate-180' : ''}`} />
                                        </div>
                                    </div>
                                </button>
                                {showTripMenu && (
                                    <div className="absolute top-full left-0 mt-3 w-72 bg-white/95 backdrop-blur-xl rounded-2xl shadow-xl shadow-stone-200/50 p-3 border border-white/60 animate-in fade-in slide-in-from-top-2 z-50">
                                        <div className="max-h-60 overflow-y-auto custom-scrollbar">
                                            {trips.map(trip => (
                                                <div key={trip.id} onClick={() => { setCurrentTripId(trip.id); setShowTripMenu(false); }} className={`flex justify-between items-center p-3 rounded-xl cursor-pointer transition-colors ${currentTripId === trip.id ? 'bg-amber-50 text-amber-700' : 'hover:bg-stone-50 text-stone-600'}`}>
                                                    <span className="font-bold truncate max-w-[160px]">{trip.destination}</span>
                                                    {trips.length > 1 && <button onClick={(e) => { e.stopPropagation(); if(trips.length<=1)return; setTripToDelete(trip.id); setShowTripMenu(false); }} className="text-stone-300 hover:text-rose-400 p-1"><Trash2 size={14} /></button>}
                                                </div>
                                            ))}
                                        </div>
                                        <div className="h-px bg-stone-100 my-2" />
                                        <button onClick={() => { setNewTripName("京都 Kyoto"); setShowCreateModal(true); setShowTripMenu(false); }} className="w-full flex items-center justify-center gap-2 p-3 text-sm font-bold text-amber-600 hover:bg-amber-50 rounded-xl transition-colors"><Plus size={16} /> 新增旅遊計畫</button>
                                    </div>
                                )}
                            </div>
                            <div className="text-right hidden md:block">
                                <h1 className="text-2xl font-bold flex items-center justify-end gap-2 text-stone-800">Travel Vibe <Plane className="transform -rotate-45 text-amber-600" /></h1>
                                <p className="text-stone-600 font-medium opacity-80 text-sm flex items-center justify-end gap-1"><Users size={12} className="text-amber-500"/> 公開協作模式</p>
                            </div>
                        </div>

                        {/* Main Grid */}
                        <div className="md:flex md:gap-8">
                            {/* Left Column */}
                            <div className="md:w-[380px] flex flex-col gap-6 shrink-0">
                                {/* Flight Widget */}
                                <div className="bg-white/80 backdrop-blur-xl rounded-3xl shadow-lg shadow-amber-100/50 border border-white/60 overflow-hidden group hover:shadow-xl transition-all">
                                    <div className="flex border-b border-stone-100">
                                        <button onClick={() => { setFlightTab('outbound'); setIsFlightExpanded(true); }} className={`flex-1 py-4 font-bold text-sm flex items-center justify-center gap-2 transition-colors ${flightTab === 'outbound' ? 'bg-amber-50/50 text-amber-600' : 'text-stone-400 hover:text-stone-600'}`}><PlaneTakeoff size={16} /> 去程</button>
                                        <div className="w-px bg-stone-100"></div>
                                        <button onClick={() => { setFlightTab('inbound'); setIsFlightExpanded(true); }} className={`flex-1 py-4 font-bold text-sm flex items-center justify-center gap-2 transition-colors ${flightTab === 'inbound' ? 'bg-amber-50/50 text-amber-600' : 'text-stone-400 hover:text-stone-600'}`}><PlaneLanding size={16} /> 回程</button>
                                        <div className="w-px bg-stone-100"></div>
                                        <button onClick={() => setIsFlightExpanded(!isFlightExpanded)} className="px-4 text-stone-400 hover:bg-stone-50 transition-colors">
                                            <ChevronDown size={16} className={`transition-transform duration-300 ${isFlightExpanded ? 'rotate-180' : ''}`} />
                                        </button>
                                    </div>
                                    
                                    <div className={`overflow-hidden transition-[max-height,opacity] duration-300 ease-in-out ${isFlightExpanded ? 'max-h-[500px] opacity-100' : 'max-h-0 opacity-0'}`}>
                                        <div className="p-5">
                                            <div className="flex gap-2 mb-4 items-end">
                                                <div className="flex-1 space-y-1">
                                                    <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wider pl-1">日期 Date</label>
                                                    <BlurInput type="date" className="w-full bg-stone-100/50 rounded-xl px-3 py-2 text-sm font-semibold text-stone-700 outline-none focus:ring-2 focus:ring-amber-200 transition-all border border-transparent focus:border-amber-200 focus:bg-white" value={currentFlight.date} onSave={(val) => updateFlightInput(flightTab, 'date', val)} />
                                                </div>
                                                <div className="w-24 space-y-1">
                                                    <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wider pl-1">航班 Flight</label>
                                                    <BlurInput type="text" placeholder="JX800" className="w-full bg-stone-100/50 rounded-xl px-3 py-2 text-sm font-mono font-bold text-stone-700 outline-none focus:ring-2 focus:ring-amber-200 transition-all border border-transparent focus:border-amber-200 focus:bg-white uppercase" value={currentFlight.code} onSave={(val) => updateFlightInput(flightTab, 'code', val)} onKeyDown={(e) => e.key === 'Enter' && searchFlight(flightTab)} />
                                                </div>
                                                <button onClick={() => searchFlight(flightTab)} className="flex-none bg-amber-400 text-amber-950 rounded-xl px-3 py-2.5 font-bold text-xs shadow-lg shadow-amber-200/50 hover:bg-amber-500 active:scale-95 transition-all flex items-center justify-center gap-1 h-[38px] whitespace-nowrap" title="自動帶入航班資訊">
                                                    {isSearchingFlight ? '...' : '自動帶入'}
                                                </button>
                                            </div>
                                            
                                            <div className="bg-gradient-to-br from-stone-50 to-amber-50/50 rounded-2xl p-4 border border-amber-100 relative overflow-hidden">
                                                <div className="flex justify-between items-center mb-3">
                                                    <BlurInput className="text-[10px] font-bold bg-amber-500 text-white px-2 py-0.5 rounded-full shadow-sm w-24 text-center border-none outline-none placeholder:text-white/70" value={displayFlightData.airline} placeholder="航空公司" onSave={(v) => updateFlightData(flightTab, 'airline', v)} />
                                                    <span className="text-[10px] text-stone-400 font-mono">{currentFlight.code.toUpperCase() || 'FLIGHT'}</span>
                                                </div>
                                                <div className="flex justify-between items-end text-center">
                                                    <div>
                                                        <BlurInput className="text-2xl font-black text-stone-800 leading-none w-20 text-center bg-transparent border-none outline-none placeholder:text-stone-300" value={displayFlightData.dep} placeholder="00:00" onSave={(v) => updateFlightData(flightTab, 'dep', v)} />
                                                        <BlurInput className="text-[10px] text-stone-500 font-medium mt-1 w-16 text-center bg-transparent border-none outline-none placeholder:text-stone-300" value={displayFlightData.from} placeholder="出發地" onSave={(v) => updateFlightData(flightTab, 'from', v)} />
                                                    </div>
                                                    <div className="flex-1 px-2 mb-2"><div className="h-[2px] bg-stone-300 relative w-full"><Plane size={12} className="absolute top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2 text-amber-400 fill-current" /></div></div>
                                                    <div>
                                                        <BlurInput className="text-2xl font-black text-stone-800 leading-none w-20 text-center bg-transparent border-none outline-none placeholder:text-stone-300" value={displayFlightData.arr} placeholder="00:00" onSave={(v) => updateFlightData(flightTab, 'arr', v)} />
                                                        <BlurInput className="text-[10px] text-stone-500 font-medium mt-1 w-16 text-center bg-transparent border-none outline-none placeholder:text-stone-300" value={displayFlightData.to} placeholder="目的地" onSave={(v) => updateFlightData(flightTab, 'to', v)} />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                {/* Memo Widget */}
                                <div className="bg-white/80 backdrop-blur-xl rounded-3xl p-5 shadow-lg shadow-amber-100/50 border border-white/60 flex-1 flex flex-col max-h-[400px]">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-lg font-bold text-stone-700 flex items-center gap-2"><div className="p-1.5 bg-yellow-100 rounded-lg text-yellow-700"><LinkIcon size={16} /></div> 備忘錄</h2>
                                        <button onClick={addMemo} className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-lg font-bold hover:bg-yellow-200 transition-colors">+ 新增</button>
                                    </div>
                                    <div className="space-y-3 overflow-y-auto pr-1 custom-scrollbar flex-1">
                                        {(currentTrip.memos || []).map((memo) => (
                                            <div key={memo.id} className="group relative bg-yellow-50/80 rounded-xl p-3 border border-yellow-100 hover:border-yellow-300 transition-all shadow-sm">
                                                {editingMemoId === memo.id ? (
                                                    <div className="relative">
                                                        <textarea 
                                                            autoFocus
                                                            className="w-full bg-transparent border-none outline-none text-sm text-stone-700 resize-none min-h-[60px] placeholder:text-yellow-700/30"
                                                            value={tempMemoContent}
                                                            onChange={(e) => setTempMemoContent(e.target.value)}
                                                            placeholder="輸入事項..."
                                                        />
                                                        <div className="flex justify-end gap-2 mt-2 pt-2 border-t border-yellow-200/50">
                                                            <button 
                                                                onClick={() => handleCancelMemo(memo.id)}
                                                                className="px-3 py-1.5 rounded-lg text-xs font-bold text-stone-500 hover:bg-stone-100 transition-colors flex items-center gap-1"
                                                            >
                                                                <X size={12} /> 取消
                                                            </button>
                                                            <button 
                                                                onClick={() => handleSaveMemo(memo.id)}
                                                                className="px-3 py-1.5 rounded-lg text-xs font-bold text-white bg-amber-500 hover:bg-amber-600 shadow-md shadow-amber-200 transition-all active:scale-95 flex items-center gap-1"
                                                            >
                                                                <Check size={12} /> 儲存
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="flex justify-between items-start gap-2">
                                                        <div className="flex-1 text-sm min-h-[20px] cursor-pointer" onClick={() => handleStartEditMemo(memo)}>
                                                            {memo.content ? <LinkifiedText text={memo.content} /> : <span className="text-yellow-700/40 italic">點擊輸入...</span>}
                                                        </div>
                                                        <div className="flex gap-1 shrink-0">
                                                            <button 
                                                                onClick={() => handleStartEditMemo(memo)}
                                                                className="text-stone-300 hover:text-amber-600 p-1"
                                                                title="編輯"
                                                            >
                                                                <Edit3 size={14} />
                                                            </button>
                                                            <button 
                                                                onClick={() => deleteMemo(memo.id)} 
                                                                className="text-stone-300 hover:text-rose-400 p-1"
                                                                title="刪除"
                                                            >
                                                                <Trash2 size={14} />
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                        {(currentTrip.memos || []).length === 0 && <div className="text-center py-8 text-stone-400 text-xs italic">還沒有備忘錄，新增一筆吧！</div>}
                                    </div>
                                </div>
                            </div>
                            {/* Right Column: Itinerary */}
                            <div className="flex-1 mt-6 md:mt-0 bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-xl shadow-stone-200/50 border border-white/60 flex flex-col">
                                <div className="mb-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold text-stone-700 flex items-center gap-2"><div className="p-2 bg-amber-100 rounded-full text-amber-600"><Calendar size={20} /></div> 行程表</h2>
                                        <button onClick={addItineraryItem} className="flex items-center gap-1 bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-full text-sm font-bold transition-all shadow-lg shadow-amber-200/50 active:scale-95"><Plus size={16} /> 新增行程</button>
                                    </div>
                                    <div className="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                                        {Array.from({ length: currentTrip.days || 1 }).map((_, i) => (
                                            <button key={i} onClick={() => setSelectedDay(i + 1)} className={`shrink-0 px-4 py-2 rounded-xl text-sm font-bold transition-all ${selectedDay === i + 1 ? 'bg-stone-800 text-amber-50 shadow-lg shadow-stone-400/30 scale-105' : 'bg-white text-stone-500 hover:bg-stone-100 border border-stone-100'}`}>Day {i + 1}</button>
                                        ))}
                                        <button onClick={addDay} className="shrink-0 px-3 py-2 rounded-xl text-sm font-bold bg-amber-100 text-amber-700 hover:bg-amber-200 border border-amber-100 transition-colors" title="新增一天">+</button>
                                    </div>
                                </div>
                                <div className="space-y-3 pb-4 w-full">
                                    {dayItinerary.map((item, index) => (
                                        <div 
                                            key={item.id} 
                                            draggable 
                                            onDragStart={(e) => { 
                                                if (hoverHandleId.current !== item.id) { e.preventDefault(); return; }
                                                dragItem.current = index; 
                                                e.target.classList.add('opacity-50'); 
                                            }} 
                                            onDragEnter={(e) => { dragOverItem.current = index; }} 
                                            onDragEnd={(e) => { handleSort(); e.target.classList.remove('opacity-50'); }} 
                                            onDragOver={(e) => e.preventDefault()} 
                                            className="group relative bg-white rounded-2xl p-3 shadow-sm border border-stone-100 hover:shadow-md hover:border-amber-100 transition-all flex gap-3 items-start animate-in fade-in slide-in-from-bottom-2 duration-300 w-full"
                                        >
                                            <div 
                                                className="mt-2 text-stone-300 hover:text-stone-500 cursor-grab active:cursor-grabbing p-1 -m-1"
                                                onMouseEnter={() => hoverHandleId.current = item.id}
                                                onMouseLeave={() => hoverHandleId.current = null}
                                                onTouchStart={() => hoverHandleId.current = item.id}
                                            >
                                                <GripVertical size={20} />
                                            </div>

                                            <div className="flex-1 min-w-0 flex flex-col gap-1 w-full">
                                                
                                                {/* Top Meta Row */}
                                                <div className="flex items-center gap-3">
                                                    <div className="flex items-center gap-1 text-amber-600 bg-amber-50/50 px-1.5 py-0.5 rounded-md shrink-0">
                                                        <Clock size={10} className="shrink-0" />
                                                        <BlurInput 
                                                            type="text" 
                                                            value={item.time} 
                                                            onSave={(val) => updateItineraryItem(item.id, 'time', val)} 
                                                            className="w-12 bg-transparent font-mono font-bold text-xs text-stone-600 border-none outline-none text-center p-0 focus:text-amber-600"
                                                            onDragStart={(e) => { e.preventDefault(); e.stopPropagation(); }}
                                                            onMouseDown={(e) => e.stopPropagation()}
                                                        />
                                                    </div>
                                                    <div className="w-px h-3 bg-stone-200 shrink-0"></div>
                                                    <div className="flex-1 flex items-center gap-1 text-stone-400 group/location min-w-0">
                                                         <MapPin size={12} className="shrink-0" />
                                                         <BlurInput 
                                                            type="text" 
                                                            value={item.location} 
                                                            placeholder="地點" 
                                                            onSave={(val) => updateItineraryItem(item.id, 'location', val)} 
                                                            className="w-full bg-transparent text-xs font-medium text-stone-500 border-none outline-none placeholder:text-stone-300 focus:bg-stone-50 rounded px-1 -ml-1 transition-colors truncate min-w-0" 
                                                            onDragStart={(e) => { e.preventDefault(); e.stopPropagation(); }}
                                                            onMouseDown={(e) => e.stopPropagation()}
                                                         />
                                                         {(item.location && item.location !== '地點') && <button onClick={() => openGoogleMaps(item.location)} className="opacity-0 group-hover/location:opacity-100 p-1 hover:bg-amber-50 text-amber-500 rounded transition-all shrink-0" title="在 Google Maps 開啟"><Map size={12} /></button>}
                                                    </div>
                                                </div>

                                                {/* Bottom Content Row */}
                                                <div className="flex items-center gap-3 pl-0.5 w-full">
                                                    <div className="relative shrink-0">
                                                        <button onClick={() => setEditingCategory(editingCategory === item.id ? null : item.id)} className={`p-1.5 rounded-lg transition-colors shadow-sm ${CATEGORIES[item.category || 'other'].color}`}>{React.createElement(CATEGORIES[item.category || 'other'].icon, { size: 16 })}</button>
                                                        {editingCategory === item.id && (
                                                            <>
                                                                <div className="absolute top-full left-0 mt-1 bg-white rounded-xl shadow-xl border border-stone-100 p-1.5 z-20 flex gap-1 animate-in fade-in zoom-in-95 duration-200">
                                                                    {Object.entries(CATEGORIES).map(([key, config]) => (
                                                                        <button key={key} onClick={() => { updateItineraryItem(item.id, 'category', key); setEditingCategory(null); }} className={`p-2 rounded-lg hover:brightness-95 transition-all ${config.color}`} title={config.label}>{React.createElement(config.icon, { size: 14 })}</button>
                                                                    ))}
                                                                </div>
                                                                <div className="fixed inset-0 z-10" onClick={() => setEditingCategory(null)} />
                                                            </>
                                                        )}
                                                    </div>
                                                    <BlurInput 
                                                        type="text" 
                                                        value={item.title} 
                                                        placeholder="行程標題" 
                                                        onSave={(val) => updateItineraryItem(item.id, 'title', val)} 
                                                        className="flex-1 bg-transparent text-lg font-bold text-stone-800 border-none p-0 outline-none placeholder:text-stone-300 focus:bg-stone-50 rounded px-1 -ml-1 transition-colors min-w-0" 
                                                        onDragStart={(e) => { e.preventDefault(); e.stopPropagation(); }}
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                    />
                                                </div>
                                                
                                                {/* Note Section */}
                                                <div className="ml-10 mt-1 w-[calc(100%-40px)]">
                                                    {editingNoteId === item.id ? (
                                                        <div className="relative animate-in fade-in slide-in-from-top-1 duration-200 bg-yellow-50 rounded-xl border border-yellow-200 p-2 shadow-sm w-full">
                                                            <textarea 
                                                                autoFocus
                                                                value={tempNote}
                                                                onChange={(e) => setTempNote(e.target.value)}
                                                                className="w-full bg-transparent border-none outline-none text-sm text-stone-700 resize-none min-h-[60px] placeholder:text-stone-400"
                                                                placeholder="輸入備註 (支援網址)..."
                                                                onMouseDown={(e) => e.stopPropagation()}
                                                            />
                                                            <div className="flex justify-end gap-2 mt-2 pt-2 border-t border-yellow-200/50">
                                                                <button onClick={handleCancelNote} className="px-3 py-1.5 rounded-lg text-xs font-bold text-stone-500 hover:bg-stone-100 transition-colors flex items-center gap-1"><X size={12} /> 取消</button>
                                                                <button onClick={() => handleSaveNote(item.id)} className="px-3 py-1.5 rounded-lg text-xs font-bold text-white bg-amber-500 hover:bg-amber-600 shadow-md shadow-amber-200 transition-all active:scale-95 flex items-center gap-1"><Check size={12} /> 完成</button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div onClick={() => handleStartEditNote(item)} className={`rounded-lg p-2 text-sm border border-transparent transition-all break-all cursor-pointer w-full ${item.note ? 'bg-stone-50 text-stone-500 hover:border-stone-200 hover:bg-white' : 'text-stone-300 hover:bg-stone-50 hover:text-stone-400'}`}>
                                                            {item.note ? <LinkifiedText text={item.note} /> : <span className="flex items-center gap-1 text-xs italic"><StickyNote size={12}/> 點擊輸入備註...</span>}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            <button onClick={() => deleteItineraryItem(item.id)} className="absolute top-2 right-2 p-2 text-stone-300 hover:text-rose-500 hover:bg-rose-50 rounded-full opacity-0 group-hover:opacity-100 transition-all"><Trash2 size={16} /></button>
                                        </div>
                                    ))}
                                    {dayItinerary.length === 0 && <div className="text-center py-10 text-stone-400 border-2 border-dashed border-stone-200 rounded-2xl bg-white/50">Day {selectedDay} 還沒有安排行程<br/>點擊上方按鈕開始規劃！</div>}
                                </div>
                            </div>
                        </div>
                    </div>

                    {showCreateModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-sm animate-in zoom-in-95 duration-200 border border-white/50">
                                <h3 className="text-xl font-bold text-stone-700 mb-4 flex items-center gap-2"><Plus className="text-amber-500" size={24} /> 建立新旅程</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-stone-400 uppercase tracking-wider block mb-1">目的地名稱</label>
                                        <input autoFocus type="text" value={newTripName} onChange={(e) => setNewTripName(e.target.value)} placeholder="例如: 京都、曼谷..." className="w-full bg-stone-50 border-none rounded-xl px-4 py-3 text-lg font-bold text-stone-800 outline-none focus:ring-2 focus:ring-amber-200 transition-all" onKeyDown={(e) => e.key === 'Enter' && confirmCreateTrip()} />
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button onClick={() => setShowCreateModal(false)} className="flex-1 py-3 rounded-xl font-bold text-stone-500 hover:bg-stone-100 transition-colors">取消</button>
                                        <button onClick={confirmCreateTrip} className="flex-1 py-3 rounded-xl font-bold text-white bg-amber-500 hover:bg-amber-600 shadow-lg shadow-amber-200 transition-all active:scale-95">開始規劃</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {tripToDelete && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-sm animate-in zoom-in-95 duration-200 border border-white/50">
                                <div className="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center mb-4 text-rose-500 mx-auto"><AlertTriangle size={24} /></div>
                                <h3 className="text-xl font-bold text-stone-700 mb-2 text-center">確定要刪除嗎？</h3>
                                <p className="text-stone-500 text-center mb-6 text-sm">刪除後無法復原，您確定要移除這個行程計畫嗎？</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setTripToDelete(null)} className="flex-1 py-3 rounded-xl font-bold text-stone-500 hover:bg-stone-100 transition-colors">取消</button>
                                    <button onClick={confirmDeleteTrip} className="flex-1 py-3 rounded-xl font-bold text-white bg-rose-500 hover:bg-rose-600 shadow-lg shadow-rose-200 transition-all active:scale-95">確認刪除</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<TravelVibeApp />);
    </script>
</body>
</html>
