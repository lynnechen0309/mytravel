<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Travel Vibe App</title>

    <!-- 1. iPhone 主畫面圖示設定 -->
    <link rel="apple-touch-icon" href="12345.jpg">
    <link rel="icon" href="12345.jpg">
    
    <!-- iOS Web App 設定 (讓它看起來更像原生 App) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TravelVibe">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Import Map: 解決瀏覽器端的模組匯入問題 -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.330.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }

    </script>

    <!-- Babel Standalone: 讓我們可以在瀏覽器直接跑 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 自定義捲軸樣式 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(214, 211, 209, 0.5);
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(214, 211, 209, 0.8);
        }
        
        /* 避免 iOS Safari 在拖曳時的回彈效果 */
        body {
            overscroll-behavior-y: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Plane, MapPin, GripVertical, Trash2, Plus, Calendar, 
            Link as LinkIcon, Edit3, CheckCircle2, Clock, ExternalLink, 
            PlaneTakeoff, PlaneLanding, Menu, X, ChevronDown, 
            Utensils, ShoppingBag, Camera, TrainFront, MoreHorizontal, 
            Map, Cloud, LogOut, AlertTriangle, Search
        } from 'lucide-react';

        // --- Firebase Imports ---
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";
        import { 
            getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query 
        } from "firebase/firestore";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyAJ_b9BiX1zT7WFu8f08uoKxeV8vgDUHz4",
            authDomain: "fuktrip.firebaseapp.com",
            projectId: "fuktrip",
            storageBucket: "fuktrip.firebasestorage.app",
            messagingSenderId: "663462561018",
            appId: "1:663462561018:web:d0c9f00c9fed0253a2b543",
            measurementId: "G-KME94X3EKH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = "travel-vibe-app-v1";

        // --- Helper Components ---
        
        // BlurInput: 解決中文輸入法與自動儲存衝突的問題
        const BlurInput = ({ value, onSave, className, placeholder, ...props }) => {
            const [localValue, setLocalValue] = useState(value || '');

            useEffect(() => {
                setLocalValue(value || '');
            }, [value]);

            const handleBlur = (e) => {
                if (localValue !== value) {
                    onSave(localValue);
                }
                if (props.onBlur) props.onBlur(e);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.target.blur();
                    if (props.onKeyDown) props.onKeyDown(e);
                }
            };

            return (
                <input
                    {...props}
                    className={className}
                    placeholder={placeholder}
                    value={localValue}
                    onChange={(e) => setLocalValue(e.target.value)}
                    onBlur={handleBlur}
                    onKeyDown={handleKeyDown}
                    draggable
                    onDragStart={(e) => {
                        e.stopPropagation();
                        // e.preventDefault() removed to allow text selection drag on some browsers
                        // but stopPropagation prevents the card from dragging
                    }}
                />
            );
        };

        // BlurTextarea: 解決多行輸入問題
        const BlurTextarea = ({ value, onSave, className, placeholder, ...props }) => {
            const [localValue, setLocalValue] = useState(value || '');

            useEffect(() => {
                setLocalValue(value || '');
            }, [value]);

            const handleBlur = (e) => {
                if (localValue !== value) {
                    onSave(localValue);
                }
                if (props.onBlur) props.onBlur(e);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    e.target.blur(); 
                }
                if (props.onKeyDown) props.onKeyDown(e);
            };

            return (
                <textarea
                    {...props}
                    className={className}
                    placeholder={placeholder}
                    value={localValue}
                    onChange={(e) => setLocalValue(e.target.value)}
                    onBlur={handleBlur}
                    onKeyDown={handleKeyDown}
                    draggable
                    onDragStart={(e) => {
                        e.stopPropagation();
                    }}
                />
            );
        };

        // --- Mock Data ---
        const MOCK_FLIGHT_DB = {
            'JX800': { dep: '08:30', arr: '12:45', from: 'TPE (台北)', to: 'NRT (東京)', airline: '星宇航空' },
            'JX801': { dep: '13:55', arr: '16:25', from: 'NRT (東京)', to: 'TPE (台北)', airline: '星宇航空' },
            'BR198': { dep: '08:50', arr: '13:15', from: 'TPE (台北)', to: 'NRT (東京)', airline: '長榮航空' },
            'BR178': { dep: '06:30', arr: '10:10', from: 'TPE (台北)', to: 'KIX (大阪)', airline: '長榮航空' },
            'CI100': { dep: '08:55', arr: '13:15', from: 'TPE (台北)', to: 'NRT (東京)', airline: '中華航空' },
            'CI831': { dep: '09:20', arr: '11:50', from: 'TPE (台北)', to: 'BKK (曼谷)', airline: '中華航空' },
            'IT200': { dep: '06:40', arr: '10:25', from: 'TPE (台北)', to: 'NRT (東京)', airline: '台灣虎航' },
        };

        const CATEGORIES = {
            sightseeing: { label: '景點', icon: Camera, color: 'text-amber-600 bg-amber-100' },
            food: { label: '用餐', icon: Utensils, color: 'text-orange-600 bg-orange-100' },
            shopping: { label: '購物', icon: ShoppingBag, color: 'text-rose-600 bg-rose-100' },
            transport: { label: '交通', icon: TrainFront, color: 'text-stone-600 bg-stone-200' },
            other: { label: '其他', icon: MoreHorizontal, color: 'text-stone-400 bg-stone-100' },
        };

        const generateRandomFlight = (code) => {
            const hours = Math.floor(Math.random() * 12) + 6;
            const mins = Math.floor(Math.random() * 12) * 5;
            const duration = 3 + Math.floor(Math.random() * 2);
            const depStr = `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
            const arrHour = (hours + duration) % 24;
            const arrStr = `${arrHour.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
            
            return {
                dep: depStr,
                arr: arrStr,
                from: 'TPE (未知出發地)',
                to: 'DEST (目的地)',
                airline: `航班 ${code.toUpperCase()}`
            };
        };

        const LinkifiedText = ({ text }) => {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const parts = text.split(urlRegex);
            return (
                <span className="whitespace-pre-wrap break-words leading-relaxed text-stone-600">
                    {parts.map((part, i) => {
                        if (part.match(urlRegex)) {
                            return (
                                <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="text-amber-600 hover:text-amber-700 hover:underline inline-flex items-center gap-0.5 font-medium transition-colors">
                                    <ExternalLink size={12} />
                                    {part.length > 25 ? part.substring(0, 25) + '...' : part}
                                </a>
                            );
                        }
                        return part;
                    })}
                </span>
            );
        };

        const DEFAULT_TRIP = {
            id: 'default-1',
            destination: '東京 Tokyo',
            days: 3, 
            flights: {
                outbound: { date: '', code: '', data: null },
                inbound: { date: '', code: '', data: null }
            },
            memos: [
                { id: 1, content: "記得帶護照！" },
                { id: 2, content: "訂房網址: https://www.agoda.com" }
            ],
            itinerary: [
                { id: 1, day: 1, time: '06:30', title: '前往桃園機場', location: 'TPE Terminal 2', category: 'transport' },
                { id: 2, day: 1, time: '13:00', title: '抵達飯店 Check-in', location: 'Shinjuku Prince Hotel', category: 'other' },
                { id: 3, day: 1, time: '18:00', title: '晚餐：一蘭拉麵', location: 'Shinjuku Kabukicho', category: 'food' },
            ]
        };

        // --- Main Component ---
        function TravelVibeApp() {
            const [user, setUser] = useState(null);
            const [trips, setTrips] = useState([]); 
            const [currentTripId, setCurrentTripId] = useState(null);
            const [showTripMenu, setShowTripMenu] = useState(false);
            
            const [flightTab, setFlightTab] = useState('outbound');
            const [isSearchingFlight, setIsSearchingFlight] = useState(false);
            const [editingMemoId, setEditingMemoId] = useState(null);
            const [selectedDay, setSelectedDay] = useState(1);
            const [editingCategory, setEditingCategory] = useState(null);

            const [showCreateModal, setShowCreateModal] = useState(false);
            const [newTripName, setNewTripName] = useState("");
            const [tripToDelete, setTripToDelete] = useState(null);

            const dragItem = useRef(null);
            const dragOverItem = useRef(null);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    if (!currentUser) {
                        signInAnonymously(auth).catch((error) => console.error("Auth Error:", error));
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const tripsCollectionRef = collection(db, 'artifacts', APP_ID, 'users', user.uid, 'trips');
                const q = query(tripsCollectionRef);
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const loadedTrips = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    // 修正：依照 lastModified (最後修改時間) 排序，若無則依照 ID (建立時間)
                    loadedTrips.sort((a, b) => {
                        const timeA = a.lastModified || parseInt(a.id) || 0;
                        const timeB = b.lastModified || parseInt(b.id) || 0;
                        return timeB - timeA;
                    });

                    if (loadedTrips.length === 0) {
                        saveTripToFirebase(DEFAULT_TRIP);
                    } else {
                        setTrips(loadedTrips);
                        // 如果沒有選取行程，或當前選取的行程被刪除了，就預設選取列表的第一個（也就是最近修改的）
                        if (!currentTripId || !loadedTrips.find(t => t.id === currentTripId)) {
                            setCurrentTripId(loadedTrips[0].id);
                        }
                    }
                }, (error) => console.error("Firestore Error:", error));
                return () => unsubscribe();
            }, [user, currentTripId]); 

            const saveTripToFirebase = async (tripData) => {
                if (!user) return;
                try {
                    // 修正：儲存時加入 lastModified 時間戳記
                    const dataToSave = { ...tripData, lastModified: Date.now() };
                    const tripRef = doc(db, 'artifacts', APP_ID, 'users', user.uid, 'trips', tripData.id);
                    await setDoc(tripRef, dataToSave, { merge: true });
                } catch (e) { console.error("Save Error:", e); }
            };

            const deleteTripFromFirebase = async (tripId) => {
                if (!user) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'trips', tripId));
                } catch (e) { console.error("Delete Error:", e); }
            };

            const currentTrip = trips.find(t => t.id === currentTripId) || DEFAULT_TRIP;

            const openCreateModal = () => { setNewTripName("京都 Kyoto"); setShowCreateModal(true); setShowTripMenu(false); };
            const confirmCreateTrip = () => {
                if (!newTripName.trim()) return;
                const newTripId = Date.now().toString();
                // 建立新行程時也加上 lastModified
                const newTrip = { ...DEFAULT_TRIP, id: newTripId, destination: newTripName, flights: { outbound: { date: '', code: '', data: null }, inbound: { date: '', code: '', data: null } }, memos: [], itinerary: [], days: 3, lastModified: Date.now() };
                saveTripToFirebase(newTrip); setCurrentTripId(newTripId); setShowCreateModal(false);
            };

            const openDeleteModal = (e, id) => { e.stopPropagation(); if (trips.length <= 1) return; setTripToDelete(id); setShowTripMenu(false); };
            const confirmDeleteTrip = () => { if (tripToDelete) { deleteTripFromFirebase(tripToDelete); setTripToDelete(null); } };

            const updateTripData = (field, value) => saveTripToFirebase({ ...currentTrip, [field]: value });
            
            const updateFlightInput = (type, field, value) => { const flights = { ...currentTrip.flights }; flights[type] = { ...flights[type], [field]: value }; updateTripData('flights', flights); };
            
            // 新增：直接更新航班詳細資料欄位
            const updateFlightData = (type, field, value) => {
                const flights = { ...currentTrip.flights };
                if (!flights[type]) flights[type] = { date: '', code: '', data: {} };
                // 確保 data 物件存在
                const currentData = flights[type].data || { dep: '', arr: '', from: '', to: '', airline: '' };
                flights[type].data = { ...currentData, [field]: value };
                updateTripData('flights', flights);
            };

            const searchFlight = (type) => {
                const code = currentTrip.flights[type].code;
                if (!code) return;
                setIsSearchingFlight(true);
                setTimeout(() => {
                    const formattedCode = code.toUpperCase().replace(/\s/g, '');
                    const data = MOCK_FLIGHT_DB[formattedCode] || generateRandomFlight(formattedCode);
                    const flights = { ...currentTrip.flights }; flights[type] = { ...flights[type], data: data };
                    updateTripData('flights', flights); setIsSearchingFlight(false);
                }, 600);
            };

            const addMemo = () => { const newMemos = [...currentTrip.memos, { id: Date.now(), content: "" }]; updateTripData('memos', newMemos); setEditingMemoId(newMemos[newMemos.length - 1].id); };
            const updateMemo = (id, content) => { const newMemos = currentTrip.memos.map(m => m.id === id ? { ...m, content } : m); updateTripData('memos', newMemos); };
            const deleteMemo = (id) => updateTripData('memos', currentTrip.memos.filter(m => m.id !== id));

            const addItineraryItem = () => { const newItem = { id: Date.now(), day: selectedDay, time: '12:00', title: '新行程', location: '地點', category: 'other' }; updateTripData('itinerary', [...currentTrip.itinerary, newItem]); };
            const updateItineraryItem = (id, field, value) => { const newItinerary = currentTrip.itinerary.map(item => item.id === id ? { ...item, [field]: value } : item); updateTripData('itinerary', newItinerary); };
            const deleteItineraryItem = (id) => updateTripData('itinerary', currentTrip.itinerary.filter(item => item.id !== id));

            const handleSort = () => {
                const currentDayItems = currentTrip.itinerary.filter(i => (i.day || 1) === selectedDay);
                const otherItems = currentTrip.itinerary.filter(i => (i.day || 1) !== selectedDay);
                const draggedItemContent = currentDayItems.splice(dragItem.current, 1)[0];
                currentDayItems.splice(dragOverItem.current, 0, draggedItemContent);
                dragItem.current = null; dragOverItem.current = null;
                updateTripData('itinerary', [...otherItems, ...currentDayItems]);
            };

            const addDay = () => { const newDays = (currentTrip.days || 1) + 1; updateTripData('days', newDays); setSelectedDay(newDays); };
            const openGoogleMaps = (location) => { if (!location || location === '地點') return; window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`, '_blank'); };

            const currentFlight = currentTrip.flights?.[flightTab] || { date: '', code: '', data: null };
            // 定義顯示用的資料，如果沒有 data 則提供預設空值以便編輯
            const displayFlightData = currentFlight.data || { dep: '', arr: '', from: '', to: '', airline: '' };
            
            const dayItinerary = (currentTrip.itinerary || []).filter(item => (item.day || 1) === selectedDay);

            if (!user || trips.length === 0) {
                return (
                    <div className="min-h-screen bg-amber-50 flex items-center justify-center">
                        <div className="text-amber-500 animate-pulse flex flex-col items-center gap-2">
                            <Cloud size={48} />
                            <span className="font-bold">Loading Cloud Data...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-stone-50 text-stone-800 font-sans selection:bg-amber-200 pb-20 relative">
                    <div className="fixed top-0 left-0 w-full h-80 bg-gradient-to-br from-amber-300 via-orange-300 to-rose-200 rounded-b-[4rem] shadow-xl shadow-amber-100/50 z-0 transition-all duration-700" />
                    <div className="relative z-10 max-w-5xl mx-auto px-4 pt-8">
                        <div className="flex justify-between items-start mb-10 text-stone-800">
                            <div className="relative">
                                <button onClick={() => setShowTripMenu(!showTripMenu)} className="group flex items-center gap-3 bg-white/60 backdrop-blur-md px-5 py-3 rounded-2xl hover:bg-white/80 transition-all border border-white/40 shadow-sm">
                                    <div className="bg-amber-100 p-2 rounded-xl group-hover:scale-110 transition-transform text-amber-600"><MapPin size={24} /></div>
                                    <div className="text-left">
                                        <div className="text-xs text-stone-500 font-bold uppercase tracking-wider">Current Trip</div>
                                        <div className="text-xl font-bold flex items-center gap-2 text-stone-800">{currentTrip.destination} <ChevronDown size={16} className={`transition-transform text-stone-400 ${showTripMenu ? 'rotate-180' : ''}`} /></div>
                                    </div>
                                </button>
                                {showTripMenu && (
                                    <div className="absolute top-full left-0 mt-3 w-64 bg-white/95 backdrop-blur-xl rounded-2xl shadow-xl shadow-stone-200/50 p-2 border border-white/60 animate-in fade-in slide-in-from-top-2 z-50">
                                        {trips.map(trip => (
                                            <div key={trip.id} onClick={() => { setCurrentTripId(trip.id); setShowTripMenu(false); }} className={`flex justify-between items-center p-3 rounded-xl cursor-pointer transition-colors ${currentTripId === trip.id ? 'bg-amber-50 text-amber-700' : 'hover:bg-stone-50 text-stone-600'}`}>
                                                <span className="font-bold">{trip.destination}</span>
                                                {trips.length > 1 && <button onClick={(e) => openDeleteModal(e, trip.id)} className="text-stone-300 hover:text-rose-400 p-1"><Trash2 size={14} /></button>}
                                            </div>
                                        ))}
                                        <div className="h-px bg-stone-100 my-1" />
                                        <button onClick={openCreateModal} className="w-full flex items-center justify-center gap-2 p-3 text-sm font-bold text-amber-600 hover:bg-amber-50 rounded-xl transition-colors"><Plus size={16} /> 新增旅遊計畫</button>
                                    </div>
                                )}
                            </div>
                            <div className="text-right hidden md:block">
                                <h1 className="text-2xl font-bold flex items-center justify-end gap-2 text-stone-800">Travel Vibe <Plane className="transform -rotate-45 text-amber-600" /></h1>
                                <p className="text-stone-600 font-medium opacity-80 text-sm flex items-center justify-end gap-1"><Cloud size={12} className="text-amber-500"/> Cloud Sync Active</p>
                            </div>
                        </div>

                        <div className="md:flex md:gap-8">
                            <div className="md:w-[380px] flex flex-col gap-6 shrink-0">
                                <div className="bg-white/80 backdrop-blur-xl rounded-3xl shadow-lg shadow-amber-100/50 border border-white/60 overflow-hidden group hover:shadow-xl transition-all">
                                    <div className="flex border-b border-stone-100">
                                        <button onClick={() => setFlightTab('outbound')} className={`flex-1 py-4 font-bold text-sm flex items-center justify-center gap-2 transition-colors ${flightTab === 'outbound' ? 'bg-amber-50/50 text-amber-600' : 'text-stone-400 hover:text-stone-600'}`}><PlaneTakeoff size={16} /> 去程</button>
                                        <div className="w-px bg-stone-100"></div>
                                        <button onClick={() => setFlightTab('inbound')} className={`flex-1 py-4 font-bold text-sm flex items-center justify-center gap-2 transition-colors ${flightTab === 'inbound' ? 'bg-amber-50/50 text-amber-600' : 'text-stone-400 hover:text-stone-600'}`}><PlaneLanding size={16} /> 回程</button>
                                    </div>
                                    <div className="p-5">
                                        <div className="flex gap-2 mb-4 items-end">
                                            <div className="flex-1 space-y-1">
                                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wider pl-1">日期 Date</label>
                                                <BlurInput type="date" className="w-full bg-stone-100/50 rounded-xl px-3 py-2 text-sm font-semibold text-stone-700 outline-none focus:ring-2 focus:ring-amber-200 transition-all border border-transparent focus:border-amber-200 focus:bg-white" value={currentFlight.date} onSave={(val) => updateFlightInput(flightTab, 'date', val)} />
                                            </div>
                                            <div className="w-24 space-y-1">
                                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wider pl-1">航班 Flight</label>
                                                <BlurInput type="text" placeholder="JX800" className="w-full bg-stone-100/50 rounded-xl px-3 py-2 text-sm font-mono font-bold text-stone-700 outline-none focus:ring-2 focus:ring-amber-200 transition-all border border-transparent focus:border-amber-200 focus:bg-white uppercase" value={currentFlight.code} onSave={(val) => updateFlightInput(flightTab, 'code', val)} onKeyDown={(e) => e.key === 'Enter' && searchFlight(flightTab)} />
                                            </div>
                                            <button onClick={() => searchFlight(flightTab)} className="flex-none bg-amber-400 text-amber-950 rounded-xl px-3 py-2.5 font-bold text-xs shadow-lg shadow-amber-200/50 hover:bg-amber-500 active:scale-95 transition-all flex items-center justify-center gap-1 h-[38px] whitespace-nowrap" title="自動帶入航班資訊">
                                                {isSearchingFlight ? '...' : '自動帶入'}
                                            </button>
                                        </div>
                                        
                                        {/* 修改：可編輯的航班資訊卡片 */}
                                        <div className="bg-gradient-to-br from-stone-50 to-amber-50/50 rounded-2xl p-4 border border-amber-100 relative overflow-hidden">
                                            <div className="flex justify-between items-center mb-3">
                                                {/* 航空公司 - 可編輯 */}
                                                <BlurInput 
                                                    className="text-[10px] font-bold bg-amber-500 text-white px-2 py-0.5 rounded-full shadow-sm w-24 text-center border-none outline-none placeholder:text-white/70"
                                                    value={displayFlightData.airline}
                                                    placeholder="航空公司"
                                                    onSave={(v) => updateFlightData(flightTab, 'airline', v)}
                                                />
                                                <span className="text-[10px] text-stone-400 font-mono">{currentFlight.code.toUpperCase() || 'FLIGHT'}</span>
                                            </div>
                                            <div className="flex justify-between items-end text-center">
                                                <div>
                                                    {/* 出發時間 - 可編輯 */}
                                                    <BlurInput 
                                                        className="text-2xl font-black text-stone-800 leading-none w-20 text-center bg-transparent border-none outline-none placeholder:text-stone-300"
                                                        value={displayFlightData.dep}
                                                        placeholder="00:00"
                                                        onSave={(v) => updateFlightData(flightTab, 'dep', v)}
                                                    />
                                                    {/* 出發地 - 可編輯 */}
                                                    <BlurInput 
                                                        className="text-[10px] text-stone-500 font-medium mt-1 w-16 text-center bg-transparent border-none outline-none placeholder:text-stone-300"
                                                        value={displayFlightData.from}
                                                        placeholder="出發地"
                                                        onSave={(v) => updateFlightData(flightTab, 'from', v)}
                                                    />
                                                </div>
                                                <div className="flex-1 px-2 mb-2"><div className="h-[2px] bg-stone-300 relative w-full"><Plane size={12} className="absolute top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2 text-amber-400 fill-current" /></div></div>
                                                <div>
                                                    {/* 抵達時間 - 可編輯 */}
                                                    <BlurInput 
                                                        className="text-2xl font-black text-stone-800 leading-none w-20 text-center bg-transparent border-none outline-none placeholder:text-stone-300"
                                                        value={displayFlightData.arr}
                                                        placeholder="00:00"
                                                        onSave={(v) => updateFlightData(flightTab, 'arr', v)}
                                                    />
                                                    {/* 目的地 - 可編輯 */}
                                                    <BlurInput 
                                                        className="text-[10px] text-stone-500 font-medium mt-1 w-16 text-center bg-transparent border-none outline-none placeholder:text-stone-300"
                                                        value={displayFlightData.to}
                                                        placeholder="目的地"
                                                        onSave={(v) => updateFlightData(flightTab, 'to', v)}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white/80 backdrop-blur-xl rounded-3xl p-5 shadow-lg shadow-amber-100/50 border border-white/60 flex-1 flex flex-col max-h-[400px]">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-lg font-bold text-stone-700 flex items-center gap-2"><div className="p-1.5 bg-yellow-100 rounded-lg text-yellow-700"><LinkIcon size={16} /></div> 備忘錄</h2>
                                        <button onClick={addMemo} className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-lg font-bold hover:bg-yellow-200 transition-colors">+ 新增</button>
                                    </div>
                                    <div className="space-y-3 overflow-y-auto pr-1 custom-scrollbar flex-1">
                                        {(currentTrip.memos || []).map((memo) => (
                                            <div key={memo.id} className="group relative bg-yellow-50/80 rounded-xl p-3 border border-yellow-100 hover:border-yellow-300 transition-all shadow-sm">
                                                {editingMemoId === memo.id ? (
                                                    <BlurTextarea autoFocus onBlur={() => setEditingMemoId(null)} className="w-full bg-transparent border-none outline-none text-sm text-stone-700 resize-none min-h-[60px] placeholder:text-yellow-700/30" value={memo.content} onSave={(val) => updateMemo(memo.id, val)} placeholder="輸入事項..." />
                                                ) : (
                                                    <div onClick={() => setEditingMemoId(memo.id)} className="text-sm min-h-[20px] cursor-text">{memo.content ? <LinkifiedText text={memo.content} /> : <span className="text-yellow-700/40 italic">點擊輸入...</span>}</div>
                                                )}
                                                {!editingMemoId && <button onClick={() => deleteMemo(memo.id)} className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-stone-300 hover:text-rose-400 transition-opacity"><X size={14} /></button>}
                                            </div>
                                        ))}
                                        {(currentTrip.memos || []).length === 0 && <div className="text-center py-8 text-stone-400 text-xs italic">還沒有備忘錄，新增一筆吧！</div>}
                                    </div>
                                </div>
                            </div>
                            <div className="flex-1 mt-6 md:mt-0 bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-xl shadow-stone-200/50 border border-white/60 flex flex-col h-[600px] md:h-auto">
                                <div className="mb-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold text-stone-700 flex items-center gap-2"><div className="p-2 bg-amber-100 rounded-full text-amber-600"><Calendar size={20} /></div> 行程表</h2>
                                        <button onClick={addItineraryItem} className="flex items-center gap-1 bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-full text-sm font-bold transition-all shadow-lg shadow-amber-200/50 active:scale-95"><Plus size={16} /> 新增行程</button>
                                    </div>
                                    <div className="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                                        {Array.from({ length: currentTrip.days || 1 }).map((_, i) => (
                                            <button key={i} onClick={() => setSelectedDay(i + 1)} className={`shrink-0 px-4 py-2 rounded-xl text-sm font-bold transition-all ${selectedDay === i + 1 ? 'bg-stone-800 text-amber-50 shadow-lg shadow-stone-400/30 scale-105' : 'bg-white text-stone-500 hover:bg-stone-100 border border-stone-100'}`}>Day {i + 1}</button>
                                        ))}
                                        <button onClick={addDay} className="shrink-0 px-3 py-2 rounded-xl text-sm font-bold bg-amber-100 text-amber-700 hover:bg-amber-200 border border-amber-100 transition-colors" title="新增一天">+</button>
                                    </div>
                                </div>
                                <div className="space-y-3 flex-1 overflow-y-auto pb-4 custom-scrollbar pr-2">
                                    {dayItinerary.map((item, index) => (
                                        <div key={item.id} draggable onDragStart={(e) => { if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) { e.preventDefault(); return; } dragItem.current = index; e.target.classList.add('opacity-50'); }} onDragEnter={(e) => { dragOverItem.current = index; }} onDragEnd={(e) => { handleSort(); e.target.classList.remove('opacity-50'); }} onDragOver={(e) => e.preventDefault()} className="group relative bg-white rounded-2xl p-3 shadow-sm border border-stone-100 hover:shadow-md hover:border-amber-100 transition-all cursor-grab active:cursor-grabbing flex gap-3 items-start animate-in fade-in slide-in-from-bottom-2 duration-300">
                                            <div className="mt-3 text-stone-300 hover:text-stone-500 cursor-grab"><GripVertical size={20} /></div>
                                            <div className="flex flex-col gap-1 w-20 shrink-0">
                                                <div className="flex items-center gap-1 text-stone-400 text-[10px] font-bold uppercase tracking-wider"><Clock size={10} /> TIME</div>
                                                <BlurInput type="text" value={item.time} onSave={(val) => updateItineraryItem(item.id, 'time', val)} className="w-full bg-stone-50 rounded-lg px-2 py-1 text-lg font-bold text-stone-700 border-none outline-none focus:ring-2 focus:ring-amber-200 transition-all text-center font-mono" />
                                            </div>
                                            <div className="flex-1 space-y-1.5 min-w-0">
                                                <div className="flex items-center gap-2">
                                                    <div className="relative">
                                                        <button onClick={() => setEditingCategory(editingCategory === item.id ? null : item.id)} className={`p-1.5 rounded-lg transition-colors shadow-sm ${CATEGORIES[item.category || 'other'].color}`}>{React.createElement(CATEGORIES[item.category || 'other'].icon, { size: 14 })}</button>
                                                        {editingCategory === item.id && (
                                                            <>
                                                                <div className="absolute top-full left-0 mt-1 bg-white rounded-xl shadow-xl border border-stone-100 p-1.5 z-20 flex gap-1 animate-in fade-in zoom-in-95 duration-200">
                                                                    {Object.entries(CATEGORIES).map(([key, config]) => (
                                                                        <button key={key} onClick={() => { updateItineraryItem(item.id, 'category', key); setEditingCategory(null); }} className={`p-2 rounded-lg hover:brightness-95 transition-all ${config.color}`} title={config.label}>{React.createElement(config.icon, { size: 14 })}</button>
                                                                    ))}
                                                                </div>
                                                                <div className="fixed inset-0 z-10" onClick={() => setEditingCategory(null)} />
                                                            </>
                                                        )}
                                                    </div>
                                                    <BlurInput type="text" value={item.title} placeholder="行程標題" onSave={(val) => updateItineraryItem(item.id, 'title', val)} className="flex-1 bg-transparent font-bold text-stone-800 border-none p-0 outline-none placeholder:text-stone-300 focus:bg-stone-50 rounded px-1 -ml-1 transition-colors truncate" />
                                                </div>
                                                <div className="flex items-center gap-1 text-stone-500 group/location">
                                                    <MapPin size={14} className="text-stone-400 shrink-0" />
                                                    <BlurInput type="text" value={item.location} placeholder="地點" onSave={(val) => updateItineraryItem(item.id, 'location', val)} className="w-full bg-transparent text-sm text-stone-500 border-none p-0 outline-none placeholder:text-stone-300 focus:bg-stone-50 rounded px-1 -ml-1 transition-colors" />
                                                    {(item.location && item.location !== '地點') && <button onClick={() => openGoogleMaps(item.location)} className="opacity-0 group-hover/location:opacity-100 p-1 hover:bg-amber-50 text-amber-500 rounded transition-all" title="在 Google Maps 開啟"><Map size={12} /></button>}
                                                </div>
                                            </div>
                                            <button onClick={() => deleteItineraryItem(item.id)} className="absolute top-2 right-2 p-2 text-stone-300 hover:text-rose-500 hover:bg-rose-50 rounded-full opacity-0 group-hover:opacity-100 transition-all"><Trash2 size={16} /></button>
                                        </div>
                                    ))}
                                    {dayItinerary.length === 0 && <div className="text-center py-10 text-stone-400 border-2 border-dashed border-stone-200 rounded-2xl bg-white/50">Day {selectedDay} 還沒有安排行程<br/>點擊上方按鈕開始規劃！</div>}
                                </div>
                            </div>
                        </div>
                    </div>

                    {showCreateModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-sm animate-in zoom-in-95 duration-200 border border-white/50">
                                <h3 className="text-xl font-bold text-stone-700 mb-4 flex items-center gap-2"><Plus className="text-amber-500" size={24} /> 建立新旅程</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-stone-400 uppercase tracking-wider block mb-1">目的地名稱</label>
                                        <input autoFocus type="text" value={newTripName} onChange={(e) => setNewTripName(e.target.value)} placeholder="例如: 京都、曼谷..." className="w-full bg-stone-50 border-none rounded-xl px-4 py-3 text-lg font-bold text-stone-800 outline-none focus:ring-2 focus:ring-amber-200 transition-all" onKeyDown={(e) => e.key === 'Enter' && confirmCreateTrip()} />
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button onClick={() => setShowCreateModal(false)} className="flex-1 py-3 rounded-xl font-bold text-stone-500 hover:bg-stone-100 transition-colors">取消</button>
                                        <button onClick={confirmCreateTrip} className="flex-1 py-3 rounded-xl font-bold text-white bg-amber-500 hover:bg-amber-600 shadow-lg shadow-amber-200 transition-all active:scale-95">開始規劃</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {tripToDelete && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-sm animate-in zoom-in-95 duration-200 border border-white/50">
                                <div className="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center mb-4 text-rose-500 mx-auto"><AlertTriangle size={24} /></div>
                                <h3 className="text-xl font-bold text-stone-700 mb-2 text-center">確定要刪除嗎？</h3>
                                <p className="text-stone-500 text-center mb-6 text-sm">刪除後無法復原，您確定要移除這個行程計畫嗎？</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setTripToDelete(null)} className="flex-1 py-3 rounded-xl font-bold text-stone-500 hover:bg-stone-100 transition-colors">取消</button>
                                    <button onClick={confirmDeleteTrip} className="flex-1 py-3 rounded-xl font-bold text-white bg-rose-500 hover:bg-rose-600 shadow-lg shadow-rose-200 transition-all active:scale-95">確認刪除</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Render ---
        const root = createRoot(document.getElementById('root'));
        root.render(<TravelVibeApp />);
    </script>
</body>
</html>
